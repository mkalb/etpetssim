about.help.arguments.notes                         = Bei Argumentnamen spielt die Groß- und Kleinschreibung keine Rolle. Flags nehmen auch einen booleschen Wert an (true/false, 1/0, yes/no oder on/off), z. B. --log-console=false; jeder andere Wert aktiviert das Flag. Ein Argumentwert darf Leerzeichen enthalten, wenn du das ganze Argument in Anführungszeichen setzt.
