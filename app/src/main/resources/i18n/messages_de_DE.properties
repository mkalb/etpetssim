about.help.usage                                   = Wähle auf dem Startbildschirm eine Simulation; dort kannst du auch die Sprache ändern. Die Links in der Kopfzeile führen zurück zum Startbildschirm und zu diesem Dialog. Lege die Konfiguration fest und starte, pausiere, setze fort oder brich die Simulation im Bedienfeld ab. Protokolle werden nur mit --log-console oder --log-file geschrieben.
