# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

# Runs the Gradle daemon with UTF-8 file encoding; restates the default heap and metaspace limits, which this replaces.
org.gradle.jvmargs             = -Xmx512m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8

# Caches the configuration phase result to speed up subsequent builds.
org.gradle.configuration-cache = true

# Allows Gradle to execute independent tasks/projects in parallel.
org.gradle.parallel            = true

# Enables reuse of task outputs between builds.
org.gradle.caching             = true

# Enables Gradle to show all deprecation warnings.
org.gradle.warning.mode        = all
